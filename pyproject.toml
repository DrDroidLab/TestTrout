[project]
name = "testtrout"
version = "0.1.0.dev0"
description = "Automated regression testing for AI-built web applications. Reads your repo, connects to your deployment, writes and runs a baseline test suite."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "TestTrout contributors" }]
keywords = ["testing", "regression", "playwright", "supabase", "vercel", "lovable", "qa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.15",
  "rich>=13.7",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-typescript>=0.23",
  "anthropic>=0.69",
  "openai>=1.60",
  # `trout up` is the primary entry point, so the app must run on a bare
  # install. Both are pure Python and small.
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
# Heavier or situational. `probe` pulls a browser; `mcp` is only needed to
# drive TestTrout from a coding agent.
probe = ["playwright>=1.49"]
mcp   = ["mcp>=2.0"]
all   = ["playwright>=1.49", "mcp>=2.0"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "mypy>=1.13",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
trout = "testtrout.cli.main:main"

[project.urls]
Homepage = "https://github.com/DrDroidLab/TestTrout"
Issues   = "https://github.com/DrDroidLab/TestTrout/issues"

[project.entry-points."testtrout.frameworks"]
vite-react = "testtrout.analysis.frameworks.vite_react:ViteReactAdapter"
nextjs-app = "testtrout.analysis.frameworks.nextjs:NextAppRouterAdapter"

[project.entry-points."testtrout.emitters"]
playwright = "testtrout.authoring.emitters.playwright:PlaywrightEmitter"
authorization = "testtrout.authoring.emitters.authz:BrowserAuthorizationEmitter"
endpoint-vitest = "testtrout.authoring.emitters.endpoint:EndpointEmitter"

[project.entry-points."testtrout.auth"]
supabase = "testtrout.deployment.auth.supabase_auth:SupabaseAuthAdapter"
form = "testtrout.deployment.auth.form_login:FormLoginAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testtrout"]
# The web UI and prompt templates are data files, not modules.
artifacts = ["src/testtrout/web/static/*", "src/testtrout/llm/prompts/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "D"]
ignore = ["D107", "D203", "D213", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/testtrout"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional extras and vendored grammars ship no stubs.
module = ["tree_sitter_typescript.*", "playwright.*", "mcp.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Tests are plain functions. Disabling class collection stops pytest trying to
# collect the TestKind enum from the domain model.
python_classes = []
# MCP handlers are async; run them without a per-test decorator.
asyncio_mode = "auto"
markers = [
  "live: requires a real model provider or deployment (skipped by default)",
]
