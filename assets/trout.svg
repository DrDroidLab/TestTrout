<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TestTrout">
  <title>TestTrout</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="bodyClip"><path d="M104 252c58-72 132-108 222-108 74 0 128 34 152 74 8 13 8 21 0 34-24 40-78 74-152 74-90 0-164-36-222-108z"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0b1220"/>

  <!-- water line: the trout is an indicator species; clean water is the point -->
  <path d="M56 372c34-18 62 18 96 0s62 18 96 0 62 18 96 0 62 18 96 0"
        fill="none" stroke="#1d4ed8" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round"/>
  <path d="M56 404c34-18 62 18 96 0s62 18 96 0 62 18 96 0 62 18 96 0"
        fill="none" stroke="#1d4ed8" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round"/>

  <g transform="translate(0,-18)">
    <!-- tail -->
    <path d="M104 236c-28-32-44-52-52-64 26 4 48 12 66 24zM104 268c-28 32-44 52-52 64 26-4 48-12 66-24z"
          fill="#1e40af"/>
    <!-- dorsal fin -->
    <path d="M250 148c34-26 66-34 96-26-14 24-34 42-60 54z" fill="#1d4ed8"/>
    <!-- adipose fin, the trout tell -->
    <path d="M158 196c14-10 27-13 39-10-6 11-15 19-27 24z" fill="#1d4ed8"/>
    <!-- body -->
    <path d="M104 252c58-72 132-108 222-108 74 0 128 34 152 74 8 13 8 21 0 34-24 40-78 74-152 74-90 0-164-36-222-108z"
          fill="url(#body)"/>
    <g clip-path="url(#bodyClip)">
      <path d="M96 268c60 60 140 96 232 96 60 0 112-18 148-46l0 60-380 0z"
            fill="url(#belly)"/>
    </g>
    <!-- pectoral fin -->
    <path d="M268 288c22 6 38 20 46 40-24 2-44-6-58-22z" fill="#1e40af" fill-opacity="0.9"/>
    <!-- spots -->
    <g fill="#bae6fd" fill-opacity="0.75">
      <circle cx="236" cy="212" r="9"/><circle cx="292" cy="196" r="7"/>
      <circle cx="330" cy="222" r="9"/><circle cx="268" cy="252" r="7"/>
      <circle cx="352" cy="266" r="7"/><circle cx="398" cy="216" r="8"/>
      <circle cx="196" cy="248" r="6"/><circle cx="312" cy="290" r="6"/>
    </g>
    <!-- eye -->
    <circle cx="426" cy="212" r="20" fill="#f8fafc"/>
    <circle cx="431" cy="213" r="10" fill="#0b1220"/>
    <circle cx="436" cy="207" r="4" fill="#ffffff"/>
    <!-- gill -->
    <path d="M368 172c-16 26-16 54 0 82" fill="none" stroke="#0b1220"
          stroke-opacity="0.28" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
