<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestTrout</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f8fa; --panel-2: #eef1f5; --border: #dde3ea;
    --text: #1d2530; --muted: #66748a; --accent: #2563eb;
    --critical: #b91c1c; --high: #b45309; --medium: #0e7490; --low: #64748b;
    --pass: #15803d; --fail: #b91c1c; --warn: #b45309; --incon: #7c3aed;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1319; --panel: #161b23; --panel-2: #1c232d; --border: #2a3441;
      --text: #e4e9f0; --muted: #8b98ad; --accent: #60a5fa;
      --critical: #f87171; --high: #fbbf24; --medium: #22d3ee; --low: #94a3b8;
      --pass: #4ade80; --fail: #f87171; --warn: #fbbf24; --incon: #c084fc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  a { color: var(--accent); }

  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.2px; }
  header .path { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }

  nav { display: flex; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--border); }
  nav button {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); padding: 10px 14px; cursor: pointer; font-size: 13px;
    font-family: inherit;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  nav button:hover { color: var(--text); }

  main { padding: 20px; max-width: 1200px; }
  section { display: none; }
  section.active { display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 4px; letter-spacing: -0.5px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; background: var(--accent); }

  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th {
    text-align: left; font-weight: 500; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px;
    padding: 6px 10px; border-bottom: 1px solid var(--border);
  }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--panel); }

  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px;
    font-weight: 500; white-space: nowrap;
  }
  .critical { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
  .high     { color: var(--high);     background: color-mix(in srgb, var(--high) 14%, transparent); }
  .medium   { color: var(--medium);   background: color-mix(in srgb, var(--medium) 14%, transparent); }
  .low      { color: var(--low);      background: color-mix(in srgb, var(--low) 16%, transparent); }
  .pass, .certified, .passed { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .fail, .assertion_failure  { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }
  .warning, .draft, .flake, .contract_mismatch, .quarantined, .timeout {
    color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .inconclusive, .auth_failure, .environment_failure, .dependency_failure {
    color: var(--incon); background: color-mix(in srgb, var(--incon) 14%, transparent); }
  .approved { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .rejected, .skipped { color: var(--muted); background: var(--panel-2); }

  button.action {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 12.5px;
    font-family: inherit;
  }
  button.action:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.action:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { color: #fff; opacity: 0.9; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
  .muted { color: var(--muted); }
  .note {
    border-left: 2px solid var(--accent); padding: 6px 0 6px 11px;
    margin: 8px 0; color: var(--muted); font-size: 13px;
  }
  .warnbox {
    border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--border));
    background: color-mix(in srgb, var(--warn) 7%, transparent);
    border-radius: var(--radius); padding: 10px 13px; margin: 12px 0; font-size: 13px;
  }
  .detail { background: var(--panel); border-radius: 6px; padding: 10px 12px; margin-top: 6px; }
  .detail ul { margin: 4px 0 0; padding-left: 18px; }
  .detail li { margin: 2px 0; color: var(--muted); }
  pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; overflow-x: auto; font-size: 12.5px; margin: 8px 0;
  }

  #log {
    position: fixed; bottom: 0; left: 0; right: 0; max-height: 40vh; overflow-y: auto;
    background: var(--panel); border-top: 1px solid var(--border); padding: 10px 20px;
    display: none;
  }
  #log.open { display: block; }
  #log .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  #log .line { font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 1px 0; }
  #log .warn { color: var(--warn); }
  #log .error { color: var(--fail); }
  #log .info { color: var(--muted); }
  .spinner {
    width: 11px; height: 11px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }
</style>

<style>
  .repopicker { display:flex; align-items:center; gap:8px; }
  select.repo {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 13px; max-width: 280px;
  }
  dialog {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
    color: var(--text); padding: 20px; max-width: 560px; width: 92%;
  }
  dialog::backdrop { background: rgba(0,0,0,0.5); }
  dialog h3 { margin: 0 0 4px; font-size: 15px; }
  dialog input[type=text] {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px;
    font: inherit; font-size: 13px; margin-top: 6px;
  }
  .tabs { display:flex; gap:4px; margin: 14px 0 10px; }
  .tabs button { font-size: 12.5px; }
  .repolist { max-height: 260px; overflow-y: auto; margin-top: 10px; }
  .repolist div.row {
    display:flex; gap:10px; align-items:center; padding: 6px 8px; border-radius: 6px;
    cursor: pointer;
  }
  .repolist div.row:hover { background: var(--panel); }
  .spark { display:flex; gap:3px; align-items:flex-end; height: 26px; margin-top: 8px; }
  .spark i { width: 7px; border-radius: 2px; display:block; }
</style>
</head>
<body>

<header>
  <h1>🐟 TestTrout</h1>
  <div class="repopicker">
    <select class="repo" id="repo-select"></select>
    <button class="action" id="link-btn">Link repo</button>
  </div>
  <span class="spacer"></span>
  <span id="safety"></span>
  <span class="muted mono" id="version"></span>
</header>

<nav>
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="setup">Setup</button>
  <button data-tab="gaps">Gaps</button>
  <button data-tab="scenarios">Scenarios</button>
  <button data-tab="surfaces">Surfaces</button>
  <button data-tab="runs">Runs</button>
  <button data-tab="jobs">Activity</button>
  <button data-tab="agent">Connect an agent</button>
</nav>

<main>
  <section id="overview" class="active">
    <div class="toolbar" id="actions">
      <button class="action" data-act="scan">Scan</button>
      <button class="action" data-act="probe">Probe</button>
      <button class="action" data-act="intent">Capture intent</button>
      <button class="action" data-act="propose">Propose</button>
      <button class="action" data-act="generate">Generate</button>
      <button class="action primary" data-act="run">Run</button>
      <button class="action" data-act="certify">Certify</button>
    </div>
    <div class="grid" id="cards"></div>
    <div id="overview-notes"></div>
    <div id="overview-config"></div>
  </section>

  <section id="gaps">
    <div class="toolbar">
      <span class="muted">Ranked by what to write first. Every rank is the sum of named contributions.</span>
      <span class="spacer" style="flex:1"></span>
      <button class="action" data-act="propose">Draft top 5</button>
    </div>
    <div id="gaps-body"></div>
  </section>

  <section id="scenarios">
    <div class="toolbar">
      <span class="muted">Approve what you want in the suite. Nothing is approved for you.</span>
      <span class="spacer" style="flex:1"></span>
      <button class="action" data-act="generate">Generate approved</button>
    </div>
    <div id="scenarios-body"></div>
  </section>

  <section id="setup"><div id="setup-body"></div></section>
  <section id="surfaces"><div id="surfaces-body"></div></section>
  <section id="runs"><div id="runs-body"></div></section>
  <section id="jobs"><div id="jobs-body"></div></section>
  <section id="agent"><div id="agent-body"></div></section>
</main>

<dialog id="link-dialog">
  <h3>Link a repository</h3>
  <p class="muted" style="font-size:13px;margin:0">
    A local directory is linked in place and never modified. A GitHub repository
    is cloned into <code>~/.testtrout/repos</code> first.
  </p>
  <div class="tabs">
    <button class="action" data-link-tab="local">Local folder</button>
    <button class="action" data-link-tab="github">GitHub</button>
  </div>
  <div id="link-local">
    <input type="text" id="link-path" placeholder="/path/to/your/project" autocomplete="off">
  </div>
  <div id="link-github" style="display:none">
    <div id="gh-status" class="muted" style="font-size:13px"></div>
    <div class="repolist" id="gh-repos"></div>
  </div>
  <div class="toolbar" style="margin-bottom:0">
    <span class="spacer" style="flex:1"></span>
    <button class="action" id="link-cancel">Cancel</button>
    <button class="action primary" id="link-confirm">Link</button>
  </div>
</dialog>

<div id="log">
  <div class="head">
    <span id="log-state"></span>
    <strong id="log-name" class="mono"></strong>
    <span class="spacer" style="flex:1"></span>
    <button class="action" onclick="document.getElementById('log').classList.remove('open')">Hide</button>
  </div>
  <div id="log-lines"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pill = (v) => `<span class="pill ${esc(v)}">${esc(String(v).replace(/_/g, ' '))}</span>`;

let state = { repos: [], repoId: null };

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(body.detail || res.statusText);
  }
  return res.json();
}

// ---------------------------------------------------------------- tabs

document.querySelectorAll('nav button').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach((x) => x.classList.remove('active'));
    document.querySelectorAll('section').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    $(b.dataset.tab).classList.add('active');
    render(b.dataset.tab);
  };
});

// --------------------------------------------------------------- repos

$('repo-select').onchange = (e) => {
  state.repoId = Number(e.target.value) || null;
  localStorage.setItem('trout.repo', state.repoId);
  loadRepo();
};

function renderRepoPicker() {
  const sel = $('repo-select');
  if (!state.repos.length) {
    sel.innerHTML = '<option>no repositories linked</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = state.repos.map((r) =>
    `<option value="${r.id}" ${r.id === state.repoId ? 'selected' : ''}>` +
    `${esc(r.name)}${r.exists ? '' : ' (missing)'}${r.busy ? ' · ' + esc(r.busy_with) + '…' : ''}` +
    `</option>`).join('');
}

// ---------------------------------------------------------- link dialog

const dialog = $('link-dialog');
$('link-btn').onclick = () => { dialog.showModal(); loadGithub(); };
$('link-cancel').onclick = () => dialog.close();
document.querySelectorAll('[data-link-tab]').forEach((b) => {
  b.onclick = () => {
    const github = b.dataset.linkTab === 'github';
    $('link-local').style.display = github ? 'none' : '';
    $('link-github').style.display = github ? '' : 'none';
  };
});

let selectedRemote = null;
async function loadGithub() {
  $('gh-status').textContent = 'checking for a GitHub token…';
  try {
    const d = await api('/api/github/repos');
    if (!d.authenticated) {
      $('gh-status').innerHTML = esc(d.error || 'No token found.') +
        ' Set <code>GITHUB_TOKEN</code>, run <code>gh auth login</code>, or ' +
        '<code>trout github-login</code>.';
      $('gh-repos').innerHTML = '';
      return;
    }
    $('gh-status').textContent = `signed in as ${d.account}`;
    $('gh-repos').innerHTML = d.repos.map((r) =>
      `<div class="row" data-slug="${esc(r.full_name)}">
         <strong>${esc(r.full_name)}</strong>
         ${r.private ? '<span class="pill low">private</span>' : ''}
         <span class="muted" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.description)}</span>
       </div>`).join('');
    $('gh-repos').querySelectorAll('.row').forEach((row) => {
      row.onclick = () => {
        selectedRemote = row.dataset.slug;
        $('gh-repos').querySelectorAll('.row').forEach((x) =>
          x.style.background = x === row ? 'var(--panel-2)' : '');
      };
    });
  } catch (e) {
    $('gh-status').textContent = e.message;
  }
}

$('link-confirm').onclick = async () => {
  const usingGithub = $('link-github').style.display !== 'none';
  const body = usingGithub
    ? { source: 'github', slug: selectedRemote }
    : { source: 'local', path: $('link-path').value.trim() };
  try {
    const repo = await api('/api/repos', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    dialog.close();
    state.repoId = repo.id;
    localStorage.setItem('trout.repo', repo.id);
    await loadRepos();
    await loadRepo();
    openLog('scan');
  } catch (e) { alert(e.message); }
};

// -------------------------------------------------------------- actions

document.querySelectorAll('[data-act]').forEach((b) => {
  b.onclick = async () => {
    if (!state.repoId) { alert('Link a repository first.'); return; }
    const kind = b.dataset.act;
    const options = kind === 'propose' ? { limit: 5 } : {};
    try {
      const job = await api(`/api/repos/${state.repoId}/jobs`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind, options }),
      });
      openLog(kind, job.id);
    } catch (e) { alert(e.message); }
  };
});

function openLog(name, jobId) {
  $('log').classList.add('open');
  $('log-name').textContent = name;
  $('log-lines').innerHTML = '';
  $('log-state').innerHTML = '<span class="spinner"></span>';
  setBusy(true);
  if (jobId) follow(jobId);
  else pollLatestJob(name);
}

async function pollLatestJob(kind) {
  const d = await api(`/api/jobs?repo_id=${state.repoId}&limit=5`).catch(() => null);
  const job = d && d.jobs.find((j) => j.kind === kind);
  if (job) follow(job.id);
}

function setBusy(busy) {
  document.querySelectorAll('[data-act]').forEach((b) => { b.disabled = busy; });
}

function follow(jobId) {
  const source = new EventSource(`/api/jobs/${jobId}/stream`);
  source.onmessage = (event) => {
    const line = JSON.parse(event.data);
    if (line.done) {
      source.close();
      $('log-state').textContent = line.state === 'failed' ? '✕' : '✓';
      if (line.error) {
        const div = document.createElement('div');
        div.className = 'line error';
        div.textContent = line.error;
        $('log-lines').appendChild(div);
      }
      setBusy(false);
      loadRepos(); loadRepo();
      return;
    }
    const div = document.createElement('div');
    div.className = 'line info';
    div.textContent = line.message;
    $('log-lines').appendChild(div);
    $('log').scrollTop = $('log').scrollHeight;
  };
  source.onerror = () => { source.close(); setBusy(false); loadRepo(); };
}

// --------------------------------------------------------------- render

function render(tab) {
  ({ overview: renderOverview, setup: renderSetup, gaps: renderGaps, scenarios: renderScenarios,
      surfaces: renderSurfaces, runs: renderRuns, jobs: renderJobs,
      agent: renderAgent }[tab] || (() => {}))();
}

function renderOverview() {
  const o = state.overview || {};
  const w = (o.entrypoints || []).filter((e) => e.writable);
  $('safety').innerHTML = !state.repoId ? ''
    : (o.entrypoints || []).length === 0
      ? '<span class="pill low">no deployment configured</span>'
      : w.length ? `<span class="pill high">${w.length} writable deployment(s)</span>`
                 : '<span class="pill pass">all deployments read-only</span>';

  if (!state.repoId) {
    $('cards').innerHTML = '';
    $('overview-notes').innerHTML =
      '<div class="empty">No repository linked yet. Press <strong>Link repo</strong> to start.</div>';
    $('overview-config').innerHTML = '';
    return;
  }
  if (!o.scanned) {
    $('cards').innerHTML = '';
    $('overview-notes').innerHTML =
      '<div class="empty">Not scanned yet. Press <strong>Scan</strong>.</div>';
    $('overview-config').innerHTML = '';
    return;
  }

  const c = o.coverage || {};
  const s = o.scenarios || {};
  const hist = o.history || [];
  const last = hist[0];
  const colours = { pass: 'var(--pass)', fail: 'var(--fail)',
                    warning: 'var(--warn)', inconclusive: 'var(--incon)' };

  $('cards').innerHTML = `
    <div class="card">
      <div class="label">Surface coverage</div>
      <div class="value">${c.percent ?? 0}%</div>
      <div class="bar"><div style="width:${c.percent ?? 0}%"></div></div>
      <div class="sub">${c.covered_surfaces ?? 0} of ${c.total_surfaces ?? 0} surfaces</div>
    </div>
    <div class="card">
      <div class="label">Critical coverage</div>
      <div class="value">${c.critical_percent ?? 0}%</div>
      <div class="bar"><div style="width:${c.critical_percent ?? 0}%"></div></div>
      <div class="sub">${c.critical_covered ?? 0} of ${c.critical_total ?? 0} critical surfaces</div>
    </div>
    <div class="card">
      <div class="label">Policies covered</div>
      <div class="value">${c.policies_covered ?? 0}<span class="muted" style="font-size:16px">/${c.policies_total ?? 0}</span></div>
      <div class="sub">${o.authorization_possible ? 'authorization tests possible' : 'needs a second test user'}</div>
    </div>
    <div class="card">
      <div class="label">Gaps</div>
      <div class="value">${o.gap_total ?? 0}</div>
      <div class="sub">${o.gap_ready ?? 0} ready to draft</div>
    </div>
    <div class="card">
      <div class="label">Scenarios</div>
      <div class="value">${Object.values(s).reduce((a, b) => a + b, 0)}</div>
      <div class="sub">${Object.entries(s).map(([k, v]) => `${v} ${k}`).join(' · ') || 'none yet'}</div>
    </div>
    <div class="card">
      <div class="label">Last run</div>
      <div class="value">${last ? pill(last.status) : '<span class="muted" style="font-size:16px">never</span>'}</div>
      <div class="spark">${hist.slice(0, 20).reverse().map((h) =>
        `<i style="height:${Math.max(6, Math.min(26, (h.duration_seconds || 1) * 2))}px;` +
        `background:${colours[h.status] || 'var(--border)'}" title="${esc(h.run_id)} ${esc(h.status)}"></i>`).join('')}</div>
      <div class="sub">${hist.length} run(s) recorded</div>
    </div>`;

  $('overview-notes').innerHTML = (o.notes || []).length
    ? `<div class="warnbox"><strong>What would make this better</strong>` +
      (o.notes || []).map((n) => `<div class="note">${esc(n)}</div>`).join('') + '</div>'
    : '';

  const repo = o.repo || {};
  $('overview-config').innerHTML = `
    <h3 style="margin:22px 0 0;font-size:13px">Configuration</h3>
    <table>
      <tr><td class="muted" style="width:190px">Repository</td><td>${esc(repo.name || '')}
        <span class="mono muted">${esc(repo.path || '')}</span>
        ${repo.remote ? `<span class="pill low">${esc(repo.remote)}</span>` : ''}</td></tr>
      <tr><td class="muted">Project</td><td>${esc(o.project?.framework || '?')}${o.project?.backend ? ' + ' + esc(o.project.backend) : ''}</td></tr>
      <tr><td class="muted">Deployments</td><td>${(o.entrypoints || []).map((e) =>
        `<div>${esc(e.name)} <span class="mono muted">${esc(e.url)}</span> ${e.writable
          ? '<span class="pill high">writable</span>'

/**
 * Read the form back into state before any re-render.
 *
 * Adding a row or switching provider redraws the panel, and without this every
 * unsaved field would be silently discarded — which is exactly the kind of
 * thing that makes a settings page infuriating.
 */
function harvestSetup() {
  const cfg = (state.config || {}).config || {};

  cfg.entrypoints = [...document.querySelectorAll('#ep-table tr')].map((row, i) => ({
    name: row.querySelector('[data-ep="name"]').value.trim() || `env${i}`,
    url: row.querySelector('[data-ep="url"]').value.trim(),
    disposable: row.querySelector('[data-ep="disposable"]').checked,
  }));
  cfg.test_users = [...document.querySelectorAll('#user-table tr')].map((row) => ({
    role: row.querySelector('[data-user="role"]').value.trim(),
  }));
  cfg.supabase = {
    ...(cfg.supabase || {}),
    url: $('sb-url').value.trim(),
    isolation: $('sb-isolation').value,
  };
  cfg.model = {
    ...(cfg.model || {}),
    provider: $('model-provider').value,
    model: $('model-name').value.trim(),
  };

  document.querySelectorAll('[data-secret]').forEach((input) => {
    if (input.value) pendingSecrets[input.dataset.secret] = input.value;
  });
  return cfg;
}

function wireSetup() {
  const cfg = (state.config || {}).config || {};
  const redraw = () => renderSetup();

  $('add-ep').onclick = () => {
    const c = harvestSetup();
    c.entrypoints = [...(c.entrypoints || []), { name: 'preview', url: '', disposable: false }];
    redraw();
  };
  $('add-user').onclick = () => {
    const c = harvestSetup();
    const n = (c.test_users || []).length;
    c.test_users = [...(c.test_users || []),
      { role: n === 0 ? 'owner' : n === 1 ? 'member' : `role${n}` }];
    redraw();
  };
  document.querySelectorAll('[data-remove-ep]').forEach((b) => {
    b.onclick = () => { harvestSetup().entrypoints.splice(Number(b.dataset.removeEp), 1); redraw(); };
  });
  document.querySelectorAll('[data-remove-user]').forEach((b) => {
    b.onclick = () => { harvestSetup().test_users.splice(Number(b.dataset.removeUser), 1); redraw(); };
  });

  $('model-provider').onchange = () => { harvestSetup(); redraw(); };

  $('save-setup').onclick = async () => {
    const c = harvestSetup();

    const patch = {
      // Ticking the box IS the confirmation; the API refuses without it.
      entrypoints: (c.entrypoints || [])
        .filter((e) => e.url)
        .map((e) => ({ ...e, confirm_disposable: e.disposable })),
      test_users: (c.test_users || []).filter((u) => u.role),
      supabase: {
        url: c.supabase?.url || '',
        anon_key_var: 'SUPABASE_ANON_KEY',
        service_key_var: 'SUPABASE_SERVICE_ROLE_KEY',
        isolation: c.supabase?.isolation || 'scoped_seed',
      },
      model: {
        provider: c.model?.provider,
        model: c.model?.model || '',
        api_key_var: keyVarFor(c.model?.provider),
      },
    };

    const secrets = { ...pendingSecrets };

    try {
      $('save-msg').textContent = 'saving…';
      await api(`/api/repos/${state.repoId}/config`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      if (Object.keys(secrets).length) {
        await api(`/api/repos/${state.repoId}/secrets`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(secrets),
        });
      }
      pendingSecrets = {};
      await loadRepo();
      $('save-msg').textContent = 'saved';
    } catch (e) {
      $('save-msg').textContent = '';
      alert(e.message);
    }
  };
}

function toggle(id) {
  const el = $(id);
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

async function setStatus(id, status) {
  try {
    await api(`/api/repos/${state.repoId}/scenarios/${encodeURIComponent(id)}/status`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    await loadRepo();
  } catch (e) { alert(e.message); }
}

// ----------------------------------------------------------------- load

async function loadRepos() {
  const d = await api('/api/repos').catch(() => ({ repos: [] }));
  state.repos = d.repos || [];
  $('version').textContent = d.version ? `v${d.version}` : '';
  if (!state.repoId) {
    const saved = Number(localStorage.getItem('trout.repo'));
    state.repoId = state.repos.some((r) => r.id === saved) ? saved
                 : (state.repos[0] ? state.repos[0].id : null);
  }
  renderRepoPicker();
}

async function loadRepo() {
  if (!state.repoId) { render(activeTab()); return; }
  const base = `/api/repos/${state.repoId}`;
  const [overview, gaps, scenarios, surfaces, runs, jobs, config] = await Promise.all([
    api(`${base}/overview`).catch(() => ({})),
    api(`${base}/gaps`).catch(() => ({})),
    api(`${base}/scenarios`).catch(() => ({})),
    api(`${base}/surfaces`).catch(() => ({})),
    api(`${base}/runs`).catch(() => ({})),
    api(`/api/jobs?repo_id=${state.repoId}`).catch(() => ({})),
    api(`${base}/config`).catch(() => ({})),
  ]);
  Object.assign(state, { overview, gaps, scenarios, surfaces, runs, jobs, config });
  render(activeTab());
}

const activeTab = () => document.querySelector('nav button.active').dataset.tab;
