<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestTrout</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f8fa; --panel-2: #eef1f5; --border: #dde3ea;
    --text: #1d2530; --muted: #66748a; --accent: #2563eb;
    --pass: #15803d; --fail: #b91c1c; --warn: #b45309;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1319; --panel: #161b23; --panel-2: #1c232d; --border: #2a3441;
      --text: #e4e9f0; --muted: #8b98ad; --accent: #60a5fa;
      --pass: #4ade80; --fail: #f87171; --warn: #fbbf24;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); display: flex;
    font: 14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }

  /* ------------------------------------------------------------ sidebar */
  aside {
    width: 280px; flex: none; border-right: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column; height: 100vh;
  }
  aside header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
  aside h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.2px; }
  aside .project { color: var(--muted); font-size: 12px; margin-top: 3px;
                   overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side-body { flex: 1; overflow-y: auto; padding: 12px; }
  .side-label {
    color: var(--muted); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.6px; margin: 6px 4px 8px;
  }
  .art {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
    background: none; border: 1px solid transparent; border-radius: 8px;
    padding: 9px 10px; cursor: pointer; color: inherit; font: inherit; margin-bottom: 2px;
  }
  .art:hover { background: var(--panel-2); }
  .art.on { background: var(--panel-2); border-color: var(--border); }
  .art:disabled { opacity: 0.4; cursor: default; }
  .art .glyph { font-size: 15px; line-height: 1.2; }
  .art .name { font-weight: 500; font-size: 13px; }
  .art .sub { color: var(--muted); font-size: 11.5px; margin-top: 1px; }
  .art .count {
    margin-left: auto; background: var(--warn); color: #fff; border-radius: 9px;
    font-size: 10.5px; padding: 0 6px; line-height: 17px; font-weight: 600;
  }
  aside footer { padding: 10px 12px; border-top: 1px solid var(--border); }

  /* --------------------------------------------------------------- main */
  main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }
  .chat { flex: 1; overflow-y: auto; padding: 26px 0 20px; }
  .thread { max-width: 680px; margin: 0 auto; padding: 0 24px; }
  .msg { display: flex; gap: 11px; margin-bottom: 18px; }
  .msg .who {
    width: 24px; height: 24px; flex: none; border-radius: 6px; font-size: 13px;
    display: grid; place-items: center; background: var(--panel-2);
  }
  .msg .body { min-width: 0; flex: 1; padding-top: 1px; }
  .msg .body p { margin: 0 0 6px; }
  .msg .body p:last-child { margin-bottom: 0; }
  .msg.you .body { color: var(--muted); }
  .msg .lines { color: var(--muted); font-size: 12.5px; }
  .msg .lines div { padding: 1px 0; }
  .msg .lines div.good { color: var(--pass); }
  .msg .lines div.bad { color: var(--fail); }

  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button.act {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button.act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.act:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { color: #fff; opacity: 0.9; }

  /* -------------------------------------------------------------- panel */
  .panel {
    border-top: 1px solid var(--border); background: var(--panel);
    max-height: 58vh; overflow-y: auto; display: none;
  }
  .panel.open { display: block; }
  .panel .inner { max-width: 900px; margin: 0 auto; padding: 18px 24px 28px; }
  .panel h2 { font-size: 14px; margin: 0 0 2px; }
  .panel .close { float: right; }
  h3.sec { font-size: 12px; color: var(--muted); text-transform: uppercase;
           letter-spacing: 0.5px; margin: 20px 0 6px; }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 26px 0; text-align: center; }

  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 500; }
  .ok   { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .bad  { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }
  .wait { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .dim  { color: var(--muted); background: var(--panel-2); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-weight: 500; margin-bottom: 2px; }
  .field .why { color: var(--muted); font-size: 12.5px; margin-bottom: 6px; }
  .field .ev { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  input[type=text], input[type=password] {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 13px;
  }
  .pair { display: flex; gap: 8px; }
  pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 9px 11px; overflow-x: auto; font-size: 12.5px; margin: 4px 0 0;
  }
  dialog {
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg);
    color: var(--text); padding: 20px; max-width: 520px; width: 92%;
  }
  dialog::backdrop { background: rgba(0,0,0,0.5); }
  dialog h3 { margin: 0 0 4px; font-size: 15px; }
  .spinner {
    width: 11px; height: 11px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<aside>
  <header>
    <h1>🐟 TestTrout</h1>
    <div class="project" id="project-name">no project</div>
  </header>
  <div class="side-body">
    <div class="side-label">Artifacts</div>
    <div id="artifacts"></div>
  </div>
  <footer>
    <select id="project-select" style="width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:6px 8px;font:inherit;font-size:12.5px"></select>
    <button class="act" id="add-btn" style="width:100%;margin-top:6px">Add a project</button>
  </footer>
</aside>

<main>
  <div class="chat"><div class="thread" id="thread"></div></div>
  <div class="panel" id="panel"><div class="inner" id="panel-body"></div></div>
</main>

<dialog id="add-dialog">
  <h3>Add a project</h3>
  <p class="muted" style="font-size:13px;margin:0 0 12px">
    A folder on this machine. It is read, never modified.
  </p>
  <input type="text" id="add-path" placeholder="/path/to/your/repository" autocomplete="off">
  <input type="text" id="add-url" placeholder="https://your-app.vercel.app  (optional, but I can do much more with it)"
         autocomplete="off" style="margin-top:8px">
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
    <button class="act" id="add-cancel">Cancel</button>
    <button class="act primary" id="add-confirm">Add</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const state = { projects: [], id: null, open: null, busy: false };

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok) {
    const body = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(body.detail || res.statusText);
  }
  return res.json();
}

// ------------------------------------------------------------------ chat

function say(text, { actions = [], lines = false } = {}) {
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `
    <div class="who">🐟</div>
    <div class="body">
      ${lines ? '<div class="lines"></div>' : `<p>${text}</p>`}
      ${actions.length ? `<div class="acts">${actions.map((a) =>
        `<button class="act ${a.primary ? 'primary' : ''}" data-do="${a.id}">${esc(a.label)}</button>`
      ).join('')}</div>` : ''}
    </div>`;
  $('thread').appendChild(div);
  div.querySelectorAll('[data-do]').forEach((b) => {
    b.onclick = () => ACTIONS[b.dataset.do]?.(b);
  });
  scroll();
  return div;
}

function youSay(text) {
  const div = document.createElement('div');
  div.className = 'msg you';
  div.innerHTML = `<div class="who">🙂</div><div class="body"><p>${esc(text)}</p></div>`;
  $('thread').appendChild(div);
  scroll();
}

const scroll = () => {
  const chat = document.querySelector('.chat');
  chat.scrollTop = chat.scrollHeight;
};

/** Colour a streamed line by what it says, so a long build stays readable. */
function pushLine(box, text) {
  const div = document.createElement('div');
  div.className = /kept|proven|loaded|answered/i.test(text) ? 'good'
                : /held back|could not|failed|refus/i.test(text) ? 'bad' : '';
  div.textContent = text;
  box.appendChild(div);
  scroll();
}

// --------------------------------------------------------------- actions

const ACTIONS = {
  look: () => start('understand', 'Reading the code and checking the deployment…'),
  build: () => start('build', 'Writing the baseline…'),
  run: () => start('run', 'Re-running the baseline…'),
  facts: () => openArtifact('facts'),
  plan: () => openArtifact('plan'),
  suite: () => openArtifact('suite'),
};

async function start(kind, headline) {
  if (!state.id || state.busy) return;
  setBusy(true);
  const bubble = say(headline);
  const box = document.createElement('div');
  box.className = 'lines';
  bubble.querySelector('.body').appendChild(box);

  try {
    const job = await api(`/api/repos/${state.id}/jobs`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind, options: {} }),
    });
    await follow(job.id, box);
  } catch (e) {
    pushLine(box, e.message);
  }
  setBusy(false);
  await refresh();
  await nextStep();
}

function follow(jobId, box) {
  return new Promise((resolve) => {
    const source = new EventSource(`/api/jobs/${jobId}/stream`);
    source.onmessage = (event) => {
      const line = JSON.parse(event.data);
      if (line.done) {
        source.close();
        if (line.error) pushLine(box, line.error);
        resolve();
        return;
      }
      pushLine(box, line.message);
    };
    source.onerror = () => { source.close(); resolve(); };
  });
}

function setBusy(busy) {
  state.busy = busy;
  document.querySelectorAll('[data-do]').forEach((b) => { b.disabled = busy; });
}

/**
 * Say what to do next, based on what is actually true.
 *
 * The whole interface is this function plus the artifacts. There is no wizard
 * and no step counter — the state on disk decides what is worth suggesting.
 */
async function nextStep() {
  if (!state.id) return;
  const [project, plan, facts, suite] = await Promise.all([
    api(`/api/projects/${state.id}`).catch(() => ({})),
    api(`/api/projects/${state.id}/plan`).catch(() => ({ counts: {} })),
    api(`/api/projects/${state.id}/facts`).catch(() => ({ outstanding: [] })),
    api(`/api/projects/${state.id}/suite`).catch(() => ({ counts: {} })),
  ]);

  if (!project.scanned) {
    say('I have not read this project yet.', {
      actions: [{ id: 'look', label: 'Read it', primary: true }],
    });
    return;
  }

  const ready = plan.counts?.ready || 0;
  const waiting = plan.counts?.waiting || 0;
  const asking = (facts.outstanding || []).length;
  const proven = suite.counts?.passing || 0;

  if (proven) {
    say(`Your baseline holds <strong>${proven}</strong> proven test(s).` +
        (ready ? ` I can add <strong>${ready}</strong> more.` : '') +
        ' Re-run it any time to see what changed.', {
      actions: [
        { id: 'run', label: 'Run the baseline', primary: true },
        ...(ready ? [{ id: 'build', label: `Add ${ready} more` }] : []),
        { id: 'suite', label: 'Open the suite' },
      ],
    });
    return;
  }

  if (ready) {
    say(`I can test <strong>${ready}</strong> thing(s) right now` +
        (waiting ? `, and ${waiting} more once I know a bit more` : '') + '.', {
      actions: [
        { id: 'build', label: 'Generate the tests', primary: true },
        { id: 'plan', label: 'See what they are' },
        ...(asking ? [{ id: 'facts', label: `Fill in ${asking} detail(s)` }] : []),
      ],
    });
    return;
  }

  say(asking
    ? `I cannot test anything yet. There are <strong>${asking}</strong> thing(s) only you can tell me — all optional, and each one unlocks work.`
    : 'I read the project but found nothing I can test against a deployment yet.', {
    actions: asking
      ? [{ id: 'facts', label: 'Tell me', primary: true }, { id: 'plan', label: 'See what is blocked' }]
      : [{ id: 'look', label: 'Look again' }],
  });
}

// ------------------------------------------------------------- artifacts

async function refresh() {
  if (!state.id) { $('artifacts').innerHTML = ''; return; }
  const { artifacts } = await api(`/api/projects/${state.id}/artifacts`).catch(() => ({ artifacts: [] }));
  $('artifacts').innerHTML = artifacts.map((a) => `
    <button class="art ${state.open === a.kind ? 'on' : ''}" data-art="${a.kind}" ${a.ready ? '' : 'disabled'}>
      <span class="glyph">${a.icon}</span>
      <span>
        <span class="name">${esc(a.label)}</span>
        <div class="sub">${esc(a.summary)}</div>
      </span>
      ${a.attention ? `<span class="count">${a.attention}</span>` : ''}
    </button>`).join('');
  document.querySelectorAll('[data-art]').forEach((b) => {
    b.onclick = () => openArtifact(b.dataset.art);
  });
  if (state.open) openArtifact(state.open, true);
}

async function openArtifact(kind, keepScroll) {
  state.open = kind;
  $('panel').classList.add('open');
  document.querySelectorAll('[data-art]').forEach((b) =>
    b.classList.toggle('on', b.dataset.art === kind));
  const render = { map: renderMap, facts: renderFacts, plan: renderPlan, suite: renderSuite }[kind];
  if (render) await render();
  if (!keepScroll) $('panel').scrollTop = 0;
}

function panel(title, body) {
  $('panel-body').innerHTML =
    `<button class="act close" onclick="closePanel()">Close</button><h2>${esc(title)}</h2>${body}`;
}

function closePanel() {
  state.open = null;
  $('panel').classList.remove('open');
  document.querySelectorAll('[data-art]').forEach((b) => b.classList.remove('on'));
}

async function renderMap() {
  const m = await api(`/api/projects/${state.id}/map`);
  if (!m.ready) { panel('Project map', '<div class="empty">Not read yet.</div>'); return; }
  const rows = (items, cell) => items.length
    ? `<table>${items.map((x) => `<tr>${cell(x)}</tr>`).join('')}</table>`
    : '<div class="muted">none found</div>';

  panel('Project map', `
    <p class="muted">${esc(m.summary)}</p>
    <h3 class="sec">Deployment</h3>
    <table>
      <tr><td class="muted" style="width:150px">Stack</td><td>${esc(m.stack)}</td></tr>
      <tr><td class="muted">App root</td><td class="mono">${esc(m.root)}</td></tr>
      <tr><td class="muted">Pages served at</td><td class="mono">${esc(m.deployment.url) || '<span class="muted">not set</span>'}</td></tr>
      <tr><td class="muted">API served at</td><td class="mono">${esc(m.deployment.api_url)
        || `<span class="muted">same host${m.deployment.api_base_var ? ' — but your code reads ' + esc(m.deployment.api_base_var) : ''}</span>`}</td></tr>
      <tr><td class="muted">Third parties</td><td>${m.deployment.third_parties.map(esc).join(', ') || '<span class="muted">none</span>'}</td></tr>
    </table>
    <h3 class="sec">Storage</h3>
    <table>
      <tr><td class="muted" style="width:150px">Backend</td><td>${esc(m.storage.backend)}</td></tr>
      <tr><td class="muted">Tables</td><td>${m.storage.tables.map(esc).join(', ') || '<span class="muted">none found</span>'}</td></tr>
      <tr><td class="muted">Access policies</td><td>${m.storage.policies}</td></tr>
      <tr><td class="muted">Read/write sites</td><td>${m.storage.operations}</td></tr>
    </table>
    <h3 class="sec">Pages (${m.pages.length})</h3>
    ${rows(m.pages, (p) => `<td class="mono" style="width:45%">${esc(p.path)}</td><td class="muted">${esc(p.component)}</td>`)}
    <h3 class="sec">Endpoints (${m.endpoints.length})</h3>
    ${rows(m.endpoints, (e) => `<td class="mono" style="width:45%">${esc(e.methods.join('/'))} ${esc(e.path)}</td><td class="muted mono">${esc(e.file)}</td>`)}`);
}

async function renderFacts() {
  const f = await api(`/api/projects/${state.id}/facts`);
  const out = f.outstanding || [];
  if (!out.length) {
    panel('What I need from you', `<div class="empty">Nothing outstanding —
      everything I asked for is filled in.</div>`);
    return;
  }

  const field = (fact) => {
    if (fact.kind === 'command') {
      return `<div class="field">
        <label>${esc(fact.label)}</label>
        <div class="why">${esc(fact.why)}</div>
        <pre>${esc(fact.placeholder)}</pre>
        ${fact.evidence ? `<div class="ev">${esc(fact.evidence)}</div>` : ''}
      </div>`;
    }
    const input = fact.kind === 'account'
      ? `<div class="pair">
           <input type="text" data-fact="${fact.id}" data-part="email" placeholder="email">
           <input type="password" data-fact="${fact.id}" data-part="password" placeholder="password">
         </div>`
      : `<input type="text" data-fact="${fact.id}" placeholder="${esc(fact.placeholder)}">`;
    return `<div class="field">
      <label>${esc(fact.label)}${fact.blocks ? ` <span class="pill wait">unblocks ${fact.blocks}</span>` : ''}</label>
      <div class="why">${esc(fact.why)}</div>
      ${input}
      ${fact.evidence ? `<div class="ev">${esc(fact.evidence)}</div>` : ''}
    </div>`;
  };

  panel('What I need from you', `
    <p class="muted">All optional. Give me what you have — whatever arrives gets used,
      and I never ask what your product is <em>supposed</em> to do. Passwords go to a
      gitignored <code>.env</code>, never to committed config.</p>
    ${out.map(field).join('')}
    <div class="acts"><button class="act primary" id="save-facts">Save</button>
      <span id="save-msg" class="muted"></span></div>
    ${f.answered.length ? `<h3 class="sec">Already on file</h3>
      <table>${f.answered.map((a) => `<tr><td>${esc(a.label)}</td></tr>`).join('')}</table>` : ''}`);

  $('save-facts').onclick = saveFacts;
}

async function saveFacts() {
  const payload = {};
  document.querySelectorAll('[data-fact]').forEach((input) => {
    const value = input.value.trim();
    if (!value) return;
    if (input.dataset.part) {
      payload[input.dataset.fact] = payload[input.dataset.fact] || {};
      payload[input.dataset.fact][input.dataset.part] = value;
    } else {
      payload[input.dataset.fact] = value;
    }
  });
  if (!Object.keys(payload).length) { $('save-msg').textContent = 'nothing filled in'; return; }

  $('save-msg').textContent = 'saving…';
  try {
    const { applied } = await api(`/api/projects/${state.id}/facts`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    closePanel();
    youSay(`Filled in ${applied.length} detail(s).`);
    await refresh();
    say('Thanks — let me look again with that.', {
      actions: [{ id: 'look', label: 'Look again', primary: true }],
    });
  } catch (e) {
    $('save-msg').textContent = e.message;
  }
}

async function renderPlan() {
  const p = await api(`/api/projects/${state.id}/plan`);
  const row = (c, extra) => `<tr>
    <td style="width:70px"><span class="pill dim">${esc(c.kind === 'page' ? 'browser' : 'API')}</span></td>
    <td>${esc(c.title)}<div class="muted" style="font-size:12px">${esc(c.detail)}</div></td>
    <td class="muted" style="width:34%">${extra(c)}</td></tr>`;

  panel('Test plan', `
    <p class="muted">Ready means the deployment has already answered, so I can record
      what it did and assert it keeps doing it. Nothing here is ranked by importance —
      that is your knowledge, not mine.</p>
    <h3 class="sec">Ready now (${p.ready.length})</h3>
    ${p.ready.length ? `<table>${p.ready.map((c) => row(c, () => '')).join('')}</table>`
      : '<div class="muted">nothing yet</div>'}
    <h3 class="sec">Waiting on you (${p.waiting.length})</h3>
    ${p.waiting.length ? `<table>${p.waiting.map((c) =>
      row(c, (x) => (x.needs_labels || []).map(esc).join(', '))).join('')}</table>`
      : '<div class="muted">nothing waiting</div>'}`);
}

async function renderSuite() {
  const s = await api(`/api/projects/${state.id}/suite`);
  if (!s.tests.length) {
    panel('Baseline suite', '<div class="empty">No tests yet.</div>');
    return;
  }
  const cls = { passing: 'ok', failing: 'bad', needs_info: 'wait', blocked: 'wait', untried: 'dim' };
  panel('Baseline suite', `
    <p class="muted">Every assertion here came from watching your deployment once.
      A failure means it stopped doing something it used to do.</p>
    <table>${s.tests.map((t) => `<tr>
      <td style="width:110px"><span class="pill ${cls[t.state] || 'dim'}">${esc(t.label)}</span></td>
      <td>${esc(t.title)}${t.detail ? `<div class="muted" style="font-size:12px">${esc(t.detail)}</div>` : ''}</td>
      <td class="muted mono" style="width:30%;font-size:11.5px">${esc(t.emitted_to || '')}</td>
    </tr>`).join('')}</table>`);
}

// ---------------------------------------------------------------- boot

$('add-btn').onclick = () => $('add-dialog').showModal();
$('add-cancel').onclick = () => $('add-dialog').close();
$('add-confirm').onclick = async () => {
  const path = $('add-path').value.trim();
  if (!path) return;
  try {
    const repo = await api('/api/repos', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: 'local', path, deployment_url: $('add-url').value.trim() }),
    });
    $('add-dialog').close();
    localStorage.setItem('trout.project', repo.id);
    location.reload();
  } catch (e) { alert(e.message); }
};

$('project-select').onchange = (e) => {
  localStorage.setItem('trout.project', e.target.value);
  location.reload();
};

(async () => {
  const { repos } = await api('/api/repos').catch(() => ({ repos: [] }));
  state.projects = repos;
  const saved = Number(localStorage.getItem('trout.project'));
  state.id = repos.some((r) => r.id === saved) ? saved : (repos[0]?.id ?? null);

  $('project-select').innerHTML = repos.length
    ? repos.map((r) => `<option value="${r.id}" ${r.id === state.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')
    : '<option>no projects</option>';

  if (!state.id) {
    say('Add a project to start — a folder on this machine, and the URL it is deployed at if you have one.');
    return;
  }

  const project = await api(`/api/projects/${state.id}`).catch(() => ({}));
  $('project-name').textContent = project.path || '';
  say(`<strong>${esc(project.name || '')}</strong>` +
      (project.stack ? ` — ${esc(project.stack)}` : '') +
      (project.deployment ? `, deployed at ${esc(project.deployment)}` : ', no deployment yet') + '.');
  await refresh();
  await nextStep();
})();
</script>
</body>
</html>
